{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <div class="mb-4">
          <h1 class="h3 mb-1">Web Login</h1>
          <p class="text-secondary mb-0">Mit dem Bot-Passwort anmelden.</p>
        </div>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="password">Passwort</label>
            <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Einloggen</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
