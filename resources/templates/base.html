<!doctype html>
<html lang="de" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkmk Telegram Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f8fb; }
    .navbar { box-shadow: 0 2px 20px rgba(20, 40, 80, .08); }
    .card { border: 1px solid rgba(20, 40, 80, .08); border-radius: .75rem; box-shadow: 0 10px 30px rgba(20, 40, 80, .06); }
    .metric { font-size: 2rem; font-weight: 700; letter-spacing: 0; }
    .table td, .table th { vertical-align: middle; }
    .code-output { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
{% if is_authenticated %}
<nav class="navbar navbar-expand-lg bg-white sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="{{ url_for('dashboard') }}">Checkmk Telegram Plus</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('monitoring') }}">Monitoring</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('problems') }}">Probleme</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_notifications') }}">Alerts</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_users') }}">Benutzer</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_audit') }}">Audit</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_config') }}">Config</a></li>
      </ul>
      <span class="navbar-text me-3">Site: <strong>{{ site }}</strong></span>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-outline-secondary btn-sm" type="submit">Logout</button>
      </form>
    </div>
  </div>
</nav>
{% endif %}
<main class="container-fluid py-4">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
