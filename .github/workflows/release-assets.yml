name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh
